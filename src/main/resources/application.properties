spring.application.name=restaurante
server.port=8080

# Busca el archivo .env en la raíz del proyecto o dentro de la carpeta restaurante/
spring.config.import=optional:file:.env[.properties],optional:file:./restaurante/.env[.properties]

# Conexión a PostgreSQL usando las variables del .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración de Spring Data JPA y Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Configuración de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Configuración de correo (para recuperación de contraseña)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true